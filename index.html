<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prawnsort - ระบบส่องกุ้งฝอยหน้าฟาร์ม</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-white h-screen w-screen overflow-hidden flex p-2 sm:p-3 select-none">

    <!-- คอนเทนเนอร์หลักบังคับแนวนอน ล็อคขนาดพอดีจอ 100% -->
    <div class="w-full h-full bg-slate-900 rounded-2xl border border-slate-800 p-2 sm:p-3 flex flex-row gap-3 shadow-2xl">
        
        <!-- ฝั่งซ้าย: หน้าจอกล้องส่องสด (เต็มพื้นที่ฝั่งซ้าย) -->
        <div class="relative flex-1 h-full bg-black rounded-xl overflow-hidden border border-slate-800 flex items-center justify-center">
            <video id="cameraStream" autoplay playsinline class="w-full h-full object-cover"></video>
            <img id="imagePreview" class="w-full h-full object-cover hidden" alt="Captured Shrimp">
            <canvas id="canvas" class="hidden"></canvas>

            <!-- กรอบเป้าเล็งส่องกุ้ง -->
            <div id="targetGuide" class="absolute inset-0 pointer-events-none flex items-center justify-center">
                <div class="w-56 h-36 border-2 border-emerald-400/80 rounded-xl border-dashed flex items-center justify-center bg-emerald-500/5 shadow-inner">
                    <span class="text-[11px] text-emerald-300 bg-slate-950/90 px-2.5 py-1 rounded-full border border-emerald-500/30">วางกุ้ง 1 ตัวในกรอบ</span>
                </div>
            </div>

            <!-- สถานะกล้อง -->
            <div class="absolute top-2 left-2 bg-slate-900/90 backdrop-blur px-2.5 py-1 rounded-full text-[11px] font-medium flex items-center gap-1.5 border border-slate-700">
                <span id="statusDot" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="statusText">กล้องพร้อมทำงาน</span>
            </div>
        </div>

        <!-- ฝั่งขวา: แผงควบคุมและแสดงผล (ความกว้างคงที่เหมาะกับแนวนอน) -->
        <div class="w-80 h-full flex flex-col justify-between bg-slate-950/90 rounded-xl p-3 border border-slate-800/80">
            <div class="flex flex-col h-full justify-between">
                <!-- Header -->
                <div class="flex items-center justify-between pb-2 border-b border-slate-800">
                    <div class="flex items-center gap-1.5">
                        <span class="text-xl">🦐</span>
                        <h1 class="font-bold text-base text-emerald-400">Prawnsort</h1>
                    </div>
                    <span class="text-[10px] bg-emerald-950 text-emerald-300 px-2 py-0.5 rounded-full border border-emerald-800">โหมดแนวนอนหน้าฟาร์ม</span>
                </div>

                <!-- กล่องแสดงผลการวิเคราะห์ -->
                <div class="my-2 flex-1 bg-slate-900/90 rounded-lg p-3 border border-slate-800 flex flex-col justify-center overflow-y-auto">
                    <h3 class="text-[11px] text-slate-400 mb-1.5 font-medium">ผลการวิเคราะห์ AI & พยากรณ์วันฟัก:</h3>
                    <div id="resultContainer">
                        <p class="text-xs text-slate-400 italic text-center">วางกุ้งในกรอบ แล้วกดปุ่มถ่ายรูป</p>
                    </div>
                </div>

                <!-- ปุ่มควบคุมหลัก -->
                <button id="actionBtn" onclick="handleAction()" class="w-full bg-emerald-500 hover:bg-emerald-400 active:scale-[0.98] text-slate-950 font-bold py-3 px-3 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 text-sm shrink-0">
                    <span>📸</span>
                    <span id="btnText">ถ่ายและวิเคราะห์ AI</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://prawnsort-backend.onrender.com";

        const video = document.getElementById('cameraStream');
        const canvas = document.getElementById('canvas');
        const actionBtn = document.getElementById('actionBtn');
        const btnText = document.getElementById('btnText');
        const imagePreview = document.getElementById('imagePreview');
        const resultContainer = document.getElementById('resultContainer');
        const targetGuide = document.getElementById('targetGuide');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');

        let isAnalyzing = false;
        let isCaptured = false;

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                alert("กรุณาอนุญาตการใช้งานกล้องในเบราว์เซอร์");
            }
        }

        async function handleAction() {
            if (isAnalyzing) return;
            if (!isCaptured) {
                await captureAndAnalyze();
            } else {
                resetToCamera();
            }
        }

        async function captureAndAnalyze() {
            isAnalyzing = true;
            btnText.innerText = "กำลังประมวลผล...";
            actionBtn.disabled = true;
            actionBtn.classList.add("opacity-60", "cursor-not-allowed");

            const MAX_WIDTH = 640;
            let scale = Math.min(1, MAX_WIDTH / (video.videoWidth || 640));
            canvas.width = (video.videoWidth || 640) * scale;
            canvas.height = (video.videoHeight || 480) * scale;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageDataUrl = canvas.toDataURL('image/jpeg', 0.6);
            imagePreview.src = imageDataUrl;
            imagePreview.classList.remove('hidden');
            video.classList.add('hidden');
            targetGuide.classList.add('hidden');

            statusText.innerText = "กำลังวิเคราะห์...";
            statusDot.className = "w-2 h-2 rounded-full bg-amber-500 animate-ping";

            resultContainer.innerHTML = `
                <div class="flex items-center justify-center py-4 text-emerald-400 gap-2 text-xs">
                    <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <span>วิเคราะห์กุ้ง...</span>
                </div>
            `;

            try {
                const blob = await (await fetch(imageDataUrl)).blob();
                const formData = new FormData();
                formData.append('file', blob, 'shrimp.jpg');

                const response = await fetch(`${API_URL}/predict`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error("การเชื่อมต่อเซิร์ฟเวอร์มีปัญหา");

                const data = await response.json();
                displayResults(data);

                isCaptured = true;
                btnText.innerText = "🔄 ส่องตัวถัดไป";
                actionBtn.className = "w-full bg-sky-500 hover:bg-sky-400 active:scale-[0.98] text-slate-950 font-bold py-3 px-3 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 text-sm shrink-0";
                
                statusText.innerText = "วิเคราะห์เสร็จสิ้น";
                statusDot.className = "w-2 h-2 rounded-full bg-blue-500";

            } catch (err) {
                resultContainer.innerHTML = `
                    <div class="text-rose-400 text-xs bg-rose-500/10 p-2 rounded border border-rose-500/20">
                        <p class="font-bold">❌ เชื่อมต่อล้มเหลว</p>
                        <p class="mt-0.5">กรุณากดลองใหม่อีกครั้ง</p>
                    </div>
                `;
                isCaptured = true;
                btnText.innerText = "🔄 ลองใหม่อีกครั้ง";
                actionBtn.className = "w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 px-3 rounded-xl shadow-lg text-sm shrink-0";
            } finally {
                isAnalyzing = false;
                actionBtn.disabled = false;
                actionBtn.classList.remove("opacity-60", "cursor-not-allowed");
            }
        }

        function displayResults(data) {
            const predictions = data.predictions || [];

            if (predictions.length === 0) {
                resultContainer.innerHTML = `
                    <div class="bg-amber-500/10 border border-amber-500/30 rounded p-2 text-amber-300 text-xs">
                        <p class="font-bold">⚠️ ไม่พบกุ้งในกรอบ</p>
                        <p class="mt-0.5">วางกุ้งให้อยู่ในกรอบแล้วถ่ายใหม่</p>
                    </div>
                `;
                return;
            }

            let html = `<div class="space-y-2">`;
            predictions.forEach((pred) => {
                const confPercent = Math.round((pred.confidence || 0) * 100);
                const stageName = pred.stage_name || pred.class || "ไม่ระบุระยะ";
                const forecast = pred.hatch_forecast || "ไม่สามารถประมาณการได้";

                html += `
                    <div class="bg-slate-800/90 p-2 rounded-lg border border-slate-700">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[10px] text-slate-400">ระยะพัฒนาการ:</span>
                            <span class="text-[10px] text-sky-300 bg-sky-950 px-1.5 py-0.5 rounded border border-sky-800">${confPercent}%</span>
                        </div>
                        <p class="text-xs font-bold text-emerald-400 mb-1">${stageName}</p>
                        <div class="pt-1 border-t border-slate-700/60 flex items-center justify-between">
                            <span class="text-[10px] text-slate-400">🗓️ ฟักไข่:</span>
                            <span class="text-[11px] font-bold text-amber-300">${forecast}</span>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;

            resultContainer.innerHTML = html;
        }

        function resetToCamera() {
            isCaptured = false;
            imagePreview.classList.add('hidden');
            video.classList.remove('hidden');
            targetGuide.classList.remove('hidden');

            btnText.innerText = "📸 ถ่ายและวิเคราะห์ AI";
            actionBtn.className = "w-full bg-emerald-500 hover:bg-emerald-400 active:scale-[0.98] text-slate-950 font-bold py-3 px-3 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 text-sm shrink-0";

            statusText.innerText = "กล้องพร้อมทำงาน";
            statusDot.className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";

            resultContainer.innerHTML = `
                <p class="text-xs text-slate-400 italic text-center">วางกุ้งในกรอบ แล้วกดปุ่มถ่ายรูป</p>
            `;
        }

        window.addEventListener('load', initCamera);
    </script>
</body>
</html>
