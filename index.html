<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prawnsort - ระบบกล้อง AI ตรวจจับกุ้งฝอย</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-2 sm:p-4 select-none">

    <div class="w-full max-w-5xl min-h-[85vh] bg-slate-900 rounded-3xl border border-slate-800 p-3 sm:p-4 flex flex-col md:flex-row gap-4 shadow-2xl">
        
        <!-- ฝั่งซ้าย: กล้องส่องสด -->
        <div class="relative flex-1 bg-black rounded-2xl overflow-hidden border border-slate-800 flex items-center justify-center min-h-[300px]">
            <video id="cameraStream" autoplay playsinline class="w-full h-full object-cover"></video>
            <img id="imagePreview" class="w-full h-full object-cover hidden" alt="Captured Shrimp">
            <canvas id="canvas" class="hidden"></canvas>

            <div id="targetGuide" class="absolute inset-0 pointer-events-none flex items-center justify-center">
                <div class="w-64 h-40 border-2 border-emerald-400/60 rounded-2xl border-dashed flex items-center justify-center bg-emerald-500/5">
                    <span class="text-xs text-emerald-300 bg-slate-950/80 px-3 py-1 rounded-full shadow-lg">วางกุ้ง 1 ตัวให้อยู่ในกรอบนี้</span>
                </div>
            </div>

            <div class="absolute top-3 left-3 bg-slate-900/80 backdrop-blur px-3 py-1.5 rounded-full text-xs font-medium flex items-center gap-2 border border-slate-700">
                <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="statusText">กล้องส่องกุ้งพร้อมทำงาน</span>
            </div>
        </div>

        <!-- ฝั่งขวา: แสดงผลและควบคุม -->
        <div class="w-full md:w-96 flex flex-col justify-between bg-slate-950/80 rounded-2xl p-4 border border-slate-800/80">
            <div>
                <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
                    <div class="flex items-center gap-2">
                        <span class="text-2xl">🦐</span>
                        <h1 class="font-bold text-lg text-emerald-400">Prawnsort</h1>
                    </div>
                    <span class="text-[11px] bg-slate-800 text-slate-300 px-2.5 py-1 rounded-full border border-slate-700">ส่องกุ้งทีละตัว</span>
                </div>

                <!-- กล่องแสดงผลการวิเคราะห์ -->
                <div class="bg-slate-900/90 rounded-xl p-4 border border-slate-800 min-h-[200px] flex flex-col justify-center">
                    <h3 class="text-xs text-slate-400 mb-2 font-medium">ผลการวิเคราะห์ AI & พยากรณ์วันฟัก:</h3>
                    <div id="resultContainer" class="space-y-2">
                        <p class="text-sm text-slate-400 italic text-center">จัดตำแหน่งกุ้งในกรอบ แล้วกดถ่ายรูปเพื่อวิเคราะห์</p>
                    </div>
                </div>
            </div>

            <!-- ปุ่มควบคุมหลัก -->
            <div class="mt-4">
                <button id="actionBtn" onclick="handleAction()" class="w-full bg-emerald-500 hover:bg-emerald-400 active:scale-[0.98] text-slate-950 font-bold py-3.5 px-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 text-base">
                    <span>📸</span>
                    <span id="btnText">ถ่ายและวิเคราะห์ AI</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://prawnsort-backend.onrender.com";

        const video = document.getElementById('cameraStream');
        const canvas = document.getElementById('canvas');
        const actionBtn = document.getElementById('actionBtn');
        const btnText = document.getElementById('btnText');
        const imagePreview = document.getElementById('imagePreview');
        const resultContainer = document.getElementById('resultContainer');
        const targetGuide = document.getElementById('targetGuide');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');

        let isAnalyzing = false;
        let isCaptured = false;

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                alert("กรุณาอนุญาตการใช้งานกล้องในเบราว์เซอร์มือถือ");
            }
        }

        async function handleAction() {
            if (isAnalyzing) return;
            if (!isCaptured) {
                await captureAndAnalyze();
            } else {
                resetToCamera();
            }
        }

        async function captureAndAnalyze() {
            isAnalyzing = true;
            btnText.innerText = "กำลังประมวลผลอย่างเร็ว...";
            actionBtn.disabled = true;
            actionBtn.classList.add("opacity-60", "cursor-not-allowed");

            // ย่อขนาดภาพให้ไม่เกิน 640px เพื่อลดการส่งข้อมูล (เร็วขึ้น 10 เท่า)
            const MAX_WIDTH = 640;
            let scale = Math.min(1, MAX_WIDTH / (video.videoWidth || 640));
            canvas.width = (video.videoWidth || 640) * scale;
            canvas.height = (video.videoHeight || 480) * scale;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // บีบอัดภาพ JPEG 60%
            const imageDataUrl = canvas.toDataURL('image/jpeg', 0.6);
            imagePreview.src = imageDataUrl;
            imagePreview.classList.remove('hidden');
            video.classList.add('hidden');
            targetGuide.classList.add('hidden');

            statusText.innerText = "กำลังวิเคราะห์...";
            statusDot.className = "w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping";

            resultContainer.innerHTML = `
                <div class="flex items-center justify-center py-6 text-emerald-400 gap-2">
                    <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <span>กำลังวิเคราะห์กุ้ง...</span>
                </div>
            `;

            try {
                const blob = await (await fetch(imageDataUrl)).blob();
                const formData = new FormData();
                formData.append('file', blob, 'shrimp.jpg');

                const response = await fetch(`${API_URL}/predict`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error("การเชื่อมต่อเซิร์ฟเวอร์มีปัญหา");

                const data = await response.json();
                displayResults(data);

                isCaptured = true;
                btnText.innerText = "🔄 ส่องกุ้งตัวถัดไป (เปิดกล้องใหม่)";
                actionBtn.className = "w-full bg-sky-500 hover:bg-sky-400 active:scale-[0.98] text-slate-950 font-bold py-3.5 px-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 text-base";
                
                statusText.innerText = "วิเคราะห์เสร็จสิ้น";
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-blue-500";

            } catch (err) {
                resultContainer.innerHTML = `
                    <div class="text-rose-400 text-xs bg-rose-500/10 p-3 rounded-lg border border-rose-500/20">
                        <p class="font-bold">❌ เกิดข้อผิดพลาดในการเชื่อมต่อ</p>
                        <p class="mt-1">กรุณาตรวจสอบสัญญาณอินเทอร์เน็ต หรือลองกดถ่ายใหม่อีกครั้ง</p>
                    </div>
                `;
                isCaptured = true;
                btnText.innerText = "🔄 ลองใหม่อีกครั้ง";
                actionBtn.className = "w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3.5 px-4 rounded-xl shadow-lg";
            } finally {
                isAnalyzing = false;
                actionBtn.disabled = false;
                actionBtn.classList.remove("opacity-60", "cursor-not-allowed");
            }
        }

        function displayResults(data) {
            const predictions = data.predictions || [];

            if (predictions.length === 0) {
                resultContainer.innerHTML = `
                    <div class="bg-amber-500/10 border border-amber-500/30 rounded-lg p-3 text-amber-300 text-xs">
                        <p class="font-bold">⚠️ ไม่พบกุ้งในกรอบ</p>
                        <p class="mt-1">กรุณาวางกุ้ง 1 ตัวให้อยู่ในกรอบเป้าเล็งแล้วลองถ่ายใหม่อีกครั้ง</p>
                    </div>
                `;
                return;
            }

            let html = `<div class="space-y-3">`;
            predictions.forEach((pred) => {
                const confPercent = Math.round((pred.confidence || 0) * 100);
                const stageName = pred.stage_name || pred.class || "ไม่ระบุระยะ";
                const forecast = pred.hatch_forecast || "ไม่สามารถประมาณการได้";

                html += `
                    <div class="bg-slate-800/90 p-3 rounded-xl border border-slate-700">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs text-slate-400">ระยะพัฒนาการ:</span>
                            <span class="text-xs text-sky-300 bg-sky-950 px-2 py-0.5 rounded-md border border-sky-800">ความมั่นใจ ${confPercent}%</span>
                        </div>
                        <p class="text-base font-bold text-emerald-400 mb-2">${stageName}</p>
                        <div class="pt-2 border-t border-slate-700/60 flex items-center justify-between">
                            <span class="text-xs text-slate-400">🗓️ พยากรณ์วันฟัก:</span>
                            <span class="text-xs font-bold text-amber-300">${forecast}</span>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;

            resultContainer.innerHTML = html;
        }

        function resetToCamera() {
            isCaptured = false;
            imagePreview.classList.add('hidden');
            video.classList.remove('hidden');
            targetGuide.classList.remove('hidden');

            btnText.innerText = "📸 ถ่ายและวิเคราะห์ AI";
            actionBtn.className = "w-full bg-emerald-500 hover:bg-emerald-400 active:scale-[0.98] text-slate-950 font-bold py-3.5 px-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 text-base";

            statusText.innerText = "กล้องส่องกุ้งพร้อมทำงาน";
            statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";

            resultContainer.innerHTML = `
                <p class="text-sm text-slate-400 italic text-center">จัดตำแหน่งกุ้งในกรอบ แล้วกดถ่ายรูปเพื่อวิเคราะห์</p>
            `;
        }

        window.addEventListener('load', initCamera);
    </script>
</body>
</html>
