<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Prawnsort - ระบบกล้อง AI ตรวจจับกุ้งฝอย</title>
    <!-- Tailwind CSS สำหรับตกแต่งหน้าเว็บ -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-2 sm:p-4 select-none">

    <!-- คอนเทนเนอร์หลักแนวนอน (Landscape Mode สำหรับวางในช่องส่องกุ้ง) -->
    <div class="w-full max-w-5xl h-[90vh] bg-slate-900 rounded-3xl border border-slate-800 p-3 sm:p-4 flex flex-row gap-3 shadow-2xl overflow-hidden">
      
        <!-- ฝั่งซ้าย: หน้าจอกล้องสด -->
        <div class="relative flex-1 bg-black rounded-2xl overflow-hidden border border-slate-800 flex items-center justify-center">
            <video id="cameraStream" autoplay playsinline class="w-full h-full object-cover"></video>
            <img id="imagePreview" class="w-full h-full object-cover hidden" alt="Captured Shrimp">
            <canvas id="canvas" class="hidden"></canvas>

            <!-- กรอบเป้าเล็งส่องกุ้งทีละตัว -->
            <div id="targetGuide" class="absolute inset-0 pointer-events-none flex items-center justify-center">
                <div class="w-48 h-32 border-2 border-emerald-400/60 rounded-2xl border-dashed flex items-center justify-center bg-emerald-500/5">
                    <span class="text-[11px] text-emerald-300 bg-slate-950/80 px-3 py-1 rounded-full shadow">วางกุ้งให้อยู่ในกรอบนี้</span>
                </div>
            </div>

            <!-- สถานะกล้อง -->
            <div class="absolute top-3 left-3 bg-slate-900/80 backdrop-blur px-3 py-1 rounded-full text-xs font-medium text-emerald-400 flex items-center gap-1.5 border border-slate-700">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                กล้องส่องกุ้งพร้อมทำงาน
            </div>
        </div>

        <!-- ฝั่งขวา: แผงควบคุมและแสดงผลลัพธ์ -->
        <div class="w-80 sm:w-96 flex flex-col justify-between bg-slate-950/80 rounded-2xl p-4 border border-slate-800/80">
            <div>
                <div class="flex items-center justify-between mb-2">
                    <h1 class="text-xl font-bold text-white flex items-center gap-2">
                       <span>🦐</span> Prawnsort
                    </h1>
                    <span class="bg-emerald-500/20 text-emerald-400 text-[10px] font-semibold px-2.5 py-0.5 rounded-full border border-emerald-500/30">Landscape Mode</span>
                </div>
                <p class="text-xs text-slate-400">ระบบจำแนกระยะกุ้งฝอยสำหรับใช้ในฟาร์ม</p>
            </div>

            <!-- ผลลัพธ์การวิเคราะห์ (แบ่งเป็นสัดส่วนชัดเจน) -->
            <div id="resultContainer" class="my-auto bg-slate-900 rounded-2xl p-3 border border-slate-800 flex flex-col justify-center min-h-[160px] overflow-y-auto">
                <div id="resultContent" class="text-center text-slate-400 text-xs space-y-2">
                    <p class="text-slate-500">วางกุ้งในช่องส่องแล้วกดปุ่ม <br><strong class="text-emerald-400">"📸 ถ่ายและวิเคราะห์ AI"</strong></p>
                </div>
            </div>

            <!-- ปุ่มควบคุมการทำงาน -->
            <div class="space-y-2">
                <button id="captureBtn" onclick="takeAndAnalyze()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-98 text-white font-bold py-4 rounded-2xl transition shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2 text-base cursor-pointer">
                    <span>📸</span> ถ่ายและวิเคราะห์ AI
                </button>

                <button id="resetBtn" onclick="resetCamera()" class="w-full bg-slate-800 hover:bg-slate-700 active:scale-98 text-slate-300 font-medium py-3 rounded-xl transition text-xs border border-slate-700 hidden cursor-pointer">
                    🔄 ส่องกุ้งตัวถัดไป (ถ่ายใหม่)
                </button>
            </div>
        </div>
    </div>

    <script>
   // 🔗ลิงก์ HTTPS จาก Render Prawnsort Backend
   const API_URL = "https://prawnsort-backend.onrender.com";

    const video = document.getElementById('cameraStream');
    const canvas = document.getElementById('canvas');
    const captureBtn = document.getElementById('captureBtn');
    const resetBtn = document.getElementById('resetBtn');
    const imagePreview = document.getElementById('imagePreview');
    const resultContent = document.getElementById('resultContent');
    const targetGuide = document.getElementById('targetGuide');

    // 1. เริ่มต้นเปิดกล้องหลังบนมือถือ
    async function initCamera() {
        try {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                throw new Error("Browser not supported");
            }
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { 
                    facingMode: { exact: 'environment' } 
                },
                audio: false
            });
            video.srcObject = stream;
            await video.play();
        } catch (err) {
            console.error("ลองใช้กล้องหลังแบบระบุตรงๆ ไม่สำเร็จ:", err);
            try {
                // Fallback: หากเปิดแบบ exact ไม่ได้ ให้เปิดกล้องหลังทั่วไป
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
            } catch (e) {
                console.error("ไม่สามารถเข้าถึงกล้องได้:", e);
                resultContent.innerHTML = `<p class="text-rose-400 text-xs">❌ ไม่สามารถเปิดกล้องได้ กรุณาตรวจสอบการอนุญาตสิทธิ์ในตั้งค่าเบราว์เซอร์</p>`;
            }
        }
    }

    // 2. จับภาพและส่งประมวลผลไปยัง Backend (Render)
    async function takeAndAnalyze() {
    const context = canvas.getContext('2d');
    
    // 1. กำหนดขนาดความกว้างไม่เกิน 800px เพื่อย่อขนาดภาพให้ส่งไวขึ้น
    const maxWidth = 800;
    const scaleSize = maxWidth / (video.videoWidth || 640);
    canvas.width = maxWidth;
    canvas.height = (video.videoHeight || 480) * scaleSize;

    // วาดภาพลงบน Canvas ที่ปรับขนาดแล้ว
    context.drawImage(video, 0, 0, canvas.width, canvas.height);

    // แสดงภาพพรีวิวให้ผู้ใช้เห็นทันที
    imagePreview.src = canvas.toDataURL('image/jpeg', 0.8);
    imagePreview.classList.remove('hidden');
    video.classList.add('hidden');
    targetGuide.classList.add('hidden');

    captureBtn.classList.add('opacity-50');
    captureBtn.disabled = true;
    resultContent.innerHTML = `<p class="text-emerald-400 text-xs animate-pulse">⏳ กำลังประมวลผลด้วย AI (โหมดความเร็วสูง)...</p>`;

    // 2. แปลงภาพเป็น Blob พร้อมบีบอัดคุณภาพ (0.75 = บีบอัดเหลือ 75% ไฟล์เล็กลงแต่ AI ยังอ่านชัดเจน)
    canvas.toBlob(async function(blob) {
        const formData = new FormData();
        formData.append('file', blob, 'shrimp_scan.jpg');

        try {
            const response = await fetch(`${API_URL}/predict`, {
                method: 'POST',
                headers: {
                    'ngrok-skip-browser-warning': 'true'
                },
                body: formData
            });

            if (!response.ok) {
                throw new Error(`Server Error: ${response.status}`);
            }

            const data = await response.json();
            
            // แสดงผลลัพธ์
            resultContent.innerHTML = `
                <div class="text-left space-y-1">
                    <p class="text-emerald-400 font-semibold text-xs">ผลการวิเคราะห์:</p>
                    <p class="text-white text-xs">ระยะ: <span class="font-bold text-emerald-300">${data.stage || data.result || 'ระบุไม่ได้'}</span></p>
                    <p class="text-slate-300 text-[11px]">ความมั่นใจ: ${data.confidence || 'สำเร็จ'}</p>
                </div>
            `;
        } catch (err) {
            console.error(err);
            resultContent.innerHTML = `<p class="text-rose-400 text-xs">⚠️ ไม่พบข้อมูล กรุณาส่องใหม่อีกครั้ง</p>`;
        } finally {
            captureBtn.classList.remove('opacity-50');
            captureBtn.disabled = false;
        }
    }, 'image/jpeg', 0.75);
}

    // 3. แสดงผลลัพธ์ระยะพัฒนาการและคาดการณ์วันฟัก
    function displayResult(data) {
        const stage = data.stage || "ไม่สามารถระบุได้";
        const hatchDays = data.hatch_days !== undefined ? `${data.hatch_days} วัน` : "ไม่พบข้อมูล";

        resultContent.innerHTML = `
            <div class="grid grid-cols-2 gap-2 w-full mt-1 text-left">
                <div class="bg-slate-800/80 p-2.5 rounded-lg border border-emerald-500/30">
                    <span class="text-slate-400 text-[10px] uppercase tracking-wider block">ระยะพัฒนาการ</span>
                    <span class="text-emerald-400 text-base font-bold">${stage}</span>
                </div>
                <div class="bg-slate-800/80 p-2.5 rounded-lg border border-cyan-500/30">
                    <span class="text-slate-400 text-[10px] uppercase tracking-wider block">คาดการณ์วันฟัก</span>
                    <span class="text-cyan-400 text-base font-bold">${hatchDays}</span>
                </div>
            </div>
        `;
    }

    // 4. รีเซ็ตเพื่อส่องกุ้งตัวถัดไป
    function resetCamera() {
        imagePreview.classList.add('hidden');
        video.classList.remove('hidden');
        targetGuide.classList.remove('hidden');

        captureBtn.classList.remove('hidden');
        resetBtn.classList.add('hidden');

        resultContent.innerHTML = `<p class="text-slate-500 text-xs">วางกุ้งในช่องส่องแล้วกดปุ่มส่องเพื่อวิเคราะห์</p>`;
    }

    window.addEventListener('DOMContentLoaded', initCamera);
    // บังคับล็อกหน้าจอเป็นแนวนอน
function lockLandscape() {
    if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock("landscape").catch(function(error) {
            console.log("Orientation lock not supported: ", error);
        });
    }
}
window.addEventListener("load", lockLandscape);

</script>
